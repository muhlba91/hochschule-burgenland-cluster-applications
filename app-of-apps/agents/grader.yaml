---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hsb-grader
spec:
  project: default
  source:
    path: agents/hsb-grader
    repoURL: https://github.com/muhlba91/hochschule-burgenland-cluster-applications
    targetRevision: HEAD
  destination:
    namespace: hsb-grader
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - FailOnSharedResource=true
