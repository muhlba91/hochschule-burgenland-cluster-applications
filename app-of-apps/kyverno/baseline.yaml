---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-baseline
spec:
  project: default
  ignoreDifferences:
    - kind: Secret
      name: registry-credentials
      jsonPointers:
        - /data
        - /stringData
  source:
    path: charts/kyverno-baseline
    repoURL: https://github.com/muhlba91/hochschule-burgenland-cluster-applications
    targetRevision: HEAD
  destination:
    namespace: kyverno
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - FailOnSharedResource=true
