---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: sync-vcluster-ca
  annotations:
    policies.kyverno.io/title: Sync vCluster CA Certificate
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      Extracts the CA certificate from the vc-* Secret in each vCluster
      namespace and generates a standalone Secret containing just ca.crt,
      decoded from base64, in the same namespace.
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: vc-secret-name
      expression: object.metadata.name.startsWith('vc-')
    - name: exclude-namespaces
      expression: >-
        !(object.metadata.namespace in
          ['kube-system', 'default', 'kube-public', 'kyverno', 'cilium'])
  variables:
    - name: namespace
      expression: object.metadata.namespace
    - name: vclusterName
      expression: variables.namespace
    - name: ca
      expression: string(base64.decode(object.data['certificate-authority']))
    - name: downstream
      expression: >-
        [
          {
            "kind": dyn("Secret"),
            "apiVersion": dyn("v1"),
            "metadata": dyn({
              "name": "vcluster-" + variables.vclusterName + "-ca",
              "namespace": variables.namespace
            }),
            "stringData": dyn({
              "ca.crt": variables.ca
            })
          }
        ]
  generate:
    - expression: generator.Apply(variables.namespace, variables.downstream)
