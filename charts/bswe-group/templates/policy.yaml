---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-imagepullsecrets
  annotations:
    policies.kyverno.io/title: Require imagePullSecrets
    policies.kyverno.io/category: Sample
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Some registries, both public and private, require credentials in order to pull images
      from them. This policy checks those images and if they come from the configured
      registry an `imagePullSecret` is required.
  labels:
    {{- include "bswe-group.labels" . | nindent 4 }}
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
        - deployments
        - replicasets
        - statefulsets
        - daemonsets
        - jobs
        - cronjobs
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: uses-registry
      expression: >-
        object.spec.containers.exists(c, c.image.startsWith('{{ .Values.policies.domain.registry }}/'))
  validations:
    - message: "An `imagePullSecret` is required when pulling from this registry."
      expression: >-
        has(object.spec.imagePullSecrets) &&
        object.spec.imagePullSecrets.exists(s, s.name == '{{ .Values.policies.imagePullSecret.name }}')

{{- if .Values.policies.signatures.enabled -}}
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedImageValidatingPolicy
metadata:
  name: verify-image-signature
  annotations:
    policies.kyverno.io/title: Verify Container Image Signatures
    policies.kyverno.io/category: Sample
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Images from this registry must be signed via Sigstore keyless signing,
      published either from a GitHub Actions workflow or a GitLab CI pipeline.
      This policy verifies the cosign signature and pins the image to its
      verified digest.
  labels:
    {{- include "bswe-group.labels" . | nindent 4 }}
spec:
  validationActions: [Deny]
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  matchImageReferences:
    {{- if .Values.policies.signatures.onlyNamed }}
    - glob: {{ .Values.policies.domain.registry }}/*-signed*
    {{- else }}
    - glob: {{ .Values.policies.domain.registry }}/*
    {{- end }}
  credentials:
    allowInsecureRegistry: false
    secrets:
      - {{ .Values.policies.imagePullSecret.name }}
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/.*$
        ctlog:
          url: https://rekor.sigstore.dev
    - name: gitlab
      cosign:
        keyless:
          identities:
            - issuer: https://gitlab.com
              subjectRegExp: ^https://gitlab\.com/.*$
        ctlog:
          url: https://rekor.sigstore.dev
  validationConfigurations:
    mutateDigest: true
    required: true
  validations:
    - expression: >-
        images.containers.all(image,
          verifyImageSignatures(image, [attestors.github]) > 0 ||
          verifyImageSignatures(image, [attestors.gitlab]) > 0)
      message: >-
        image signature verification failed: image must be signed via Sigstore
        keyless signing by a GitHub Actions or GitLab CI pipeline.
{{- end }}
{{- end }}
