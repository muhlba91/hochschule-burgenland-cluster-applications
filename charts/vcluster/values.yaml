---
vcluster:
  sync:
    toHost:
      configMaps:
        all: true
      secrets:
        all: true
      ingresses:
        enabled: true
      storageClasses:
        enabled: true
      persistentVolumes:
        enabled: true
      gatewayApi:
        httpRoutes:
          enabled: true
        tlsRoutes:
          enabled: true
        backendTLSPolicies:
          enabled: true
        referenceGrants:
          enabled: auto
        customResources:
          listenersets.gateway.networking.k8s.io:
            enabled: true
            scope: Namespaced
    fromHost:
      ingressClasses:
        enabled: true
      gatewayClasses:
        enabled: true
      gateways:
        enabled: true
        mappings:
          byName:
            "kgateway/*": "kgateway/*"

  controlPlane:
    distro:
      k8s:
        enabled: true

    coredns:
      deployment:
        resources:
          requests:
            memory: 64Mi
            cpu: 5m
          limits:
            memory: 64Mi
            cpu: "1"

    statefulSet:
      resources:
        requests:
          memory: 384Mi
          cpu: 75m
          ephemeral-storage: 1Gi
        limits:
          memory: 512Mi
          cpu: "1"
          ephemeral-storage: 2Gi
      persistence:
        volumeClaim:
          enabled: auto
          size: 5Gi
          storageClass: rook-ceph-block

  deploy:
    kubeProxy:
      enabled: true

  integrations:
    metricsServer:
      enabled: false

  policies:
    resourceQuota:
      enabled: false
    limitRange:
      enabled: false
    networkPolicy:
      enabled: false

  telemetry:
    enabled: false

gateway:
  enabled: true
  annotations:
    external-dns.alpha.kubernetes.io/provider: public
    external-dns.alpha.kubernetes.io/target: 178.63.69.250,2a01:4f8:121:14e2:100:3:3:1
  hostname: chart-example.local
  listenerset:
    annotations:
      cert-manager.io/cluster-issuer: cluster-issuer-muehlbachler-xyz
    certificateName: chart-example-tls
    parentRef:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: kgateway-gateway
      namespace: kgateway
